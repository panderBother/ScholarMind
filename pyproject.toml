[project]
name = "scholarmind"
version = "0.1.0"
description = "ScholarMind 单仓：Python 子包由 uv 统一解析；前端 scholarmind-web 仍用 npm（见 package.json）。"
requires-python = ">=3.11"
dependencies = [
    "scholarmind-server",
    "scholarmind-agent",
    "scholarmind-eval",
]

[tool.uv.sources]
scholarmind-server = { workspace = true }
scholarmind-agent = { workspace = true }
scholarmind-eval = { workspace = true }

[tool.uv.workspace]
members = ["scholarmind-server", "scholarmind-agent", "scholarmind-eval"]

# 开发时：`uv sync --group dev`（pytest / ruff 等；与各子包 optional dev 互补）
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]
