[project]
name = "scholarmind-agent"
version = "0.1.0"
description = "ScholarMind Agent + RAG 核心：检索、LangGraph、工作记忆与 Prompt 模板"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "httpx>=0.27.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*", "agent*", "memory*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
